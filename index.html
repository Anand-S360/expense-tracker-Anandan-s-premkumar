<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside>
    <div class="container">
      <h1>Expense Tracker</h1>

      <div class="summary">
        <p class="result">Total Income: <span id="income">₹0</span></p>
        <p class="result">Total Expense: <span id="expense">₹0</span></p>
        <p class="result">Balance: <span id="balance">₹0</span></p>
      </div>

      <form id="transaction-form">
        <select id="type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <input type="number" id="amount" placeholder="Amount" required>
        <input type="text" id="category" placeholder="Category" required>
        <input type="date" id="date" required>
        <input type="text" id="description" placeholder="Description">
        <button type="submit">Add Transaction</button>
      </form>

      <div class="filter">
        <select id="filter-type">
          <option value="all">All</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <input type="text" id="filtercategory" placeholder="Filter by category">
      </div>

      <!-- Transaction List -->
      <ul id="transactionlist"></ul>
    </div>
  </aside>
  <script src="script.js"></script>
</body>
</html>
